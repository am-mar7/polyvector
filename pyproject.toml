[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyvector-search"
version = "0.1.0"
description = "High-performance in-engine multi-field hybrid search for PostgreSQL using vertical HNSW vectors and native BM25."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "PolyVector Team"}
]
keywords = ["search", "vector", "postgres", "pgvector", "bm25", "hybrid-search", "embeddings", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "psycopg2-binary>=2.9.0",
    "fastembed>=0.2.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.0"]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyvector*"]
